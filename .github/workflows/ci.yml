name: CI

on:
  push:
    branches: [ main ]
    # Two macOS jobs, and macOS bills at 10x. This CI has been failing in under a second
    # since the tools-version bump, so it has been free by accident; once it resolves
    # dependencies again it becomes a real build on every push. Nothing listed here can
    # change what `swift build` produces. `*.md` is root-only on purpose — `**.md` would
    # also exclude the .docc catalogue, where a broken article is a real failure.
    paths-ignore:
      - '*.md'
      - 'project/**'
      - 'development-guidelines/**'
      - 'development-guidelines.pre-v2/**'
      - 'Instruction Set/**'
      - 'Documentation/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'project/**'
      - 'development-guidelines/**'
      - 'development-guidelines.pre-v2/**'
      - 'Instruction Set/**'
      - 'Documentation/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.x (Swift 6.2+)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on this runner; using the default."
            xcodebuild -version
          else
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected $XCODE_PATH"
          fi

      - name: Verify Swift meets the manifest's floor
        run: |
          swift --version
          # Package.swift declares swift-tools-version: 6.2. Assert it here so a runner
          # image that drifts below the floor fails with this message rather than with
          # "using Swift tools version 6.2.0 but the installed version is 6.1.0" from
          # somewhere deep in a build step.
          REQUIRED=6.2
          ACTUAL=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not determine the Swift version on this runner."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "::error::Package.swift needs Swift >= $REQUIRED; this runner has $ACTUAL."
            exit 1
          fi
          echo "Swift $ACTUAL satisfies the $REQUIRED floor"

      - name: Authenticate for the private SwiftMCPServer dependency
        env:
          TOKEN: ${{ secrets.SPM_PRIVATE_DEPS_TOKEN }}
        run: |
          # SwiftMCPServer is a private repository, and the default GITHUB_TOKEN is scoped
          # to this repository only. Without this, SwiftPM's clone fails with
          # "could not read Username for 'https://github.com': terminal prompts disabled",
          # which names neither the repository nor the remedy.
          if [ -z "$TOKEN" ]; then
            echo "::error::SPM_PRIVATE_DEPS_TOKEN is not set. SwiftMCPServer is a private dependency and cannot be resolved without a token granting it Contents: read."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured git to authenticate github.com clones"

      - name: Tooling versions
        run: |
          xcodebuild -version
          swift --version

      - name: Swift 6 Compliance Check (Strict Concurrency)
        run: |
          swift build -Xswiftc -strict-concurrency=complete
          echo "✅ Swift 6 strict concurrency compliance verified"

      - name: Build (Debug)
        run: swift build -v

      - name: Build (Release)
        run: swift build -c release -v

      - name: Run Tests
        run: swift test --enable-swift-testing --parallel -v

      - name: Build MCP Server Executable
        run: |
          swift build -c release --product businessmath-mcp-server
          ls -lh .build/release/businessmath-mcp-server

  integration:
    name: Integration with BusinessMath (pinned release)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.x (Swift 6.2+)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode 26.x found on this runner; using the default."
            xcodebuild -version
          else
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected $XCODE_PATH"
          fi

      - name: Verify Swift meets the manifest's floor
        run: |
          swift --version
          # Package.swift declares swift-tools-version: 6.2. Assert it here so a runner
          # image that drifts below the floor fails with this message rather than with
          # "using Swift tools version 6.2.0 but the installed version is 6.1.0" from
          # somewhere deep in a build step.
          REQUIRED=6.2
          ACTUAL=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not determine the Swift version on this runner."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "::error::Package.swift needs Swift >= $REQUIRED; this runner has $ACTUAL."
            exit 1
          fi
          echo "Swift $ACTUAL satisfies the $REQUIRED floor"

      - name: Authenticate for the private SwiftMCPServer dependency
        env:
          TOKEN: ${{ secrets.SPM_PRIVATE_DEPS_TOKEN }}
        run: |
          # SwiftMCPServer is a private repository, and the default GITHUB_TOKEN is scoped
          # to this repository only. Without this, SwiftPM's clone fails with
          # "could not read Username for 'https://github.com': terminal prompts disabled",
          # which names neither the repository nor the remedy.
          if [ -z "$TOKEN" ]; then
            echo "::error::SPM_PRIVATE_DEPS_TOKEN is not set. SwiftMCPServer is a private dependency and cannot be resolved without a token granting it Contents: read."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Configured git to authenticate github.com clones"

      - name: Test against the pinned BusinessMath release
        run: |
          echo "Resolving BusinessMath at the version Package.swift pins"
          swift package resolve
          swift build
          swift test --enable-swift-testing

      - name: Verify Server Starts
        run: |
          swift build -c release --product businessmath-mcp-server

          # Start server in background with HTTP transport (stdio exits when stdin closes)
          MCP_AUTH_REQUIRED=false .build/release/businessmath-mcp-server --http 8080 &
          SERVER_PID=$!

          # Give it time to start
          sleep 3

          # Check if process is still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "✅ Server started successfully (PID: $SERVER_PID)"
            kill $SERVER_PID
            exit 0
          else
            echo "❌ Server failed to start or crashed immediately"
            exit 1
          fi
